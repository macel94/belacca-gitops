# These policies target only workloads with selectors verified in the checked-in
# manifests and live cluster. They deliberately do not select dynamic room Pods:
# room-to-lobby callbacks and room WebSockets need an explicit application-level
# contract before isolation can safely cover them.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portfolio-traffic
  namespace: portfolio
  labels:
    belacca.com/project: portfolio
spec:
  podSelector:
    matchLabels:
      app: francesco-site
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: analytics
          podSelector:
            matchLabels:
              app: goatcounter
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pong-gateway-traffic
  namespace: pong
  labels:
    belacca.com/project: pong
spec:
  podSelector:
    matchLabels:
      app: cloudnativepong
      component: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pong-static-traffic
  namespace: pong
  labels:
    belacca.com/project: pong
spec:
  podSelector:
    matchLabels:
      app: cloudnativepong
      component: static
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudnativepong
              component: gateway
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pong-api-traffic
  namespace: pong
  labels:
    belacca.com/project: pong
spec:
  podSelector:
    matchLabels:
      app: cloudnativepong
      component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudnativepong
              component: gateway
        - podSelector:
            matchLabels:
              app: cloudnativepong
              role: room
      ports:
        - protocol: TCP
          port: 8080
  # Egress is intentionally not isolated: the lobby must reach the Kubernetes
  # API and dynamically created room Services. Those Service/end-point paths
  # require a CNI-specific contract before a deny policy is safe.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pong-api-observability-scrape
  namespace: pong
  labels:
    belacca.com/project: observability
spec:
  podSelector:
    matchLabels:
      app: cloudnativepong
      component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-traffic
  namespace: analytics
  labels:
    belacca.com/project: analytics
spec:
  podSelector:
    matchLabels:
      app: goatcounter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: portfolio
          podSelector:
            matchLabels:
              app: francesco-site
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-auth-traffic
  namespace: headlamp
  labels:
    belacca.com/project: platform
    belacca.com/component: headlamp-auth
spec:
  podSelector:
    matchLabels:
      app: oauth2-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 4180
    # Egress is intentionally not isolated: OAuth2 Proxy must reach the
    # configured Google identity provider, whose endpoint/CIDRs are external
    # runtime data and must not be invented in this repository.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-traffic
  namespace: headlamp
  labels:
    belacca.com/project: platform
    belacca.com/component: headlamp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: headlamp
      app.kubernetes.io/name: headlamp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: oauth2-proxy
      ports:
        - protocol: TCP
          port: 4466
  # Egress is intentionally not isolated: Headlamp must reach the Kubernetes
  # API through the in-cluster Service and OAuth2 Proxy owns its external OIDC
  # dependency. Add CNI-verified allow rules before introducing egress deny.
