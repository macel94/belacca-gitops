# PDBs apply only to workloads with two or more replicas in the application
# manifests. They protect one replica during voluntary disruption without
# pretending that single-writer SQLite workloads are highly available.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pong-gateway
  namespace: pong
  labels:
    belacca.com/project: pong
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: cloudnativepong
      component: gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pong-static
  namespace: pong
  labels:
    belacca.com/project: pong
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: cloudnativepong
      component: static
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: portfolio
  namespace: portfolio
  labels:
    belacca.com/project: portfolio
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: francesco-site
