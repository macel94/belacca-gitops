apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headlamp-https
  namespace: headlamp
  labels:
    belacca.com/project: platform
    belacca.com/component: headlamp
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headlamp-basic-auth
  namespace: headlamp
  labels:
    belacca.com/project: platform
    belacca.com/component: headlamp
spec:
  basicAuth:
    secret: headlamp-dashboard-auth
    realm: Headlamp Dashboard
    removeHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-http
  namespace: headlamp
  labels:
    belacca.com/project: platform
    belacca.com/component: headlamp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: headlamp-headlamp-https@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  rules:
    - host: dashboard.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    belacca.com/project: platform
    belacca.com/component: headlamp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: headlamp-headlamp-basic-auth@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dashboard.belacca.com
  rules:
    - host: dashboard.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
