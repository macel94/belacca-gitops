apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: flux-web-https
  namespace: flux-system
  labels:
    belacca.com/project: platform
    belacca.com/component: flux-web
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flux-web-http
  namespace: flux-system
  labels:
    belacca.com/project: platform
    belacca.com/component: flux-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: flux-system-flux-web-https@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  rules:
    - host: flux.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flux-web
                port:
                  number: 9080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flux-web
  namespace: flux-system
  labels:
    belacca.com/project: platform
    belacca.com/component: flux-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - flux.belacca.com
  rules:
    - host: flux.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flux-web
                port:
                  number: 9080
