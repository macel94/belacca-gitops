apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dex-https
  namespace: dex
  labels:
    belacca.com/project: platform
    belacca.com/component: identity
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dex-alias
  namespace: dex
  labels:
    belacca.com/project: platform
    belacca.com/component: identity
spec:
  redirectRegex:
    regex: ^https://dex\.belacca\.com/(.*)
    replacement: https://dashboard.belacca.com/oauth2/${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dex-http
  namespace: dex
  labels:
    belacca.com/project: platform
    belacca.com/component: identity
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: dex-dex-https@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  rules:
    - host: dex.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dex
                port:
                  number: 5556
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard-dex-http
  namespace: dex
  labels:
    belacca.com/project: platform
    belacca.com/component: identity
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: dex-dex-https@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "300"
spec:
  ingressClassName: traefik
  rules:
    - host: dashboard.belacca.com
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: dex
                port:
                  number: 5556
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard-dex
  namespace: dex
  labels:
    belacca.com/project: platform
    belacca.com/component: identity
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.priority: "300"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dashboard.belacca.com
  rules:
    - host: dashboard.belacca.com
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: dex
                port:
                  number: 5556
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dex
  namespace: dex
  labels:
    belacca.com/project: platform
    belacca.com/component: identity
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: dex-dex-alias@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dex.belacca.com
  rules:
    - host: dex.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dex
                port:
                  number: 5556
