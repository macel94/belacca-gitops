apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: portfolio
  labels:
    belacca.com/project: portfolio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - francesco.belacca.com
  rules:
    - host: francesco.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: francesco-site
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apex-redirect
  namespace: portfolio
  labels:
    belacca.com/project: portfolio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: apex-to-portfolio@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - belacca.com
        - www.belacca.com
  rules:
    - host: belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: francesco-site
                port:
                  number: 80
    - host: www.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: francesco-site
                port:
                  number: 80
