apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: analytics-https
  namespace: analytics
  labels:
    belacca.com/project: analytics
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analytics-http
  namespace: analytics
  labels:
    belacca.com/project: analytics
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: analytics-analytics-https@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  rules:
    - host: stats.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: analytics-oauth2-proxy
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analytics
  namespace: analytics
  labels:
    belacca.com/project: analytics
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - stats.belacca.com
  rules:
    - host: stats.belacca.com
      http:
        paths:
          # These paths are used by the public portfolio collector and remain
          # unauthenticated. The dashboard and all other paths use Dex SSO.
          - path: /count
            pathType: Exact
            backend:
              service:
                name: goatcounter-direct
                port:
                  number: 80
          - path: /count.js
            pathType: Exact
            backend:
              service:
                name: goatcounter-direct
                port:
                  number: 80
          - path: /status
            pathType: Exact
            backend:
              service:
                name: goatcounter-direct
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: analytics-oauth2-proxy
                port:
                  number: 80
