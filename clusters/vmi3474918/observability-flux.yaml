apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
  labels:
    belacca.com/project: observability
spec:
  interval: 10m
  path: ./clusters/vmi3474918/observability
  # Keep this opt-in/staged until the operator validates resource usage and
  # CNI connectivity on the host. It must not garbage-collect unrelated data.
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
