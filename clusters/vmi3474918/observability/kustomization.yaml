apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - config.yaml
  - deployment.yaml
  - network-policy.yaml

configMapGenerator:
  - name: observability-contracts
    namespace: observability
    files:
      - synthetic-contracts.json
      - dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        belacca.com/project: observability
