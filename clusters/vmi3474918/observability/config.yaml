apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    belacca.com/project: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        platform: belacca
        cluster: k3d-pong
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: pong-api
        metrics_path: /metrics
        static_configs:
          - targets: [pong-api.pong.svc.cluster.local:8080]
            labels:
              service: pong
              signal: application
        sample_limit: 100
      - job_name: flux-controllers
        metrics_path: /metrics
        static_configs:
          - targets:
              - source-controller.flux-system.svc.cluster.local:80
              - kustomize-controller.flux-system.svc.cluster.local:80
              - helm-controller.flux-system.svc.cluster.local:80
              - notification-controller.flux-system.svc.cluster.local:80
            labels:
              service: flux
              signal: platform
        sample_limit: 500
      # External synthetic checks remain intentionally out of cluster. They
      # publish sanitized status data through the site repository instead.
      # Do not add public hostnames here as a substitute for an external probe.
  prometheus.rules.yml: |
    groups:
      - name: belacca-slo-recording
        interval: 30s
        rules:
          - record: belacca:pong:http_requests:rate5m
            expr: sum(rate(pong_http_requests_total[5m]))
          - record: belacca:pong:http_failures:rate5m
            expr: sum(rate(pong_http_requests_failure_total[5m]))
          - record: belacca:pong:http_error_ratio:rate5m
            expr: |
              (belacca:pong:http_failures:rate5m / clamp_min(belacca:pong:http_requests:rate5m, 1))
          - record: belacca:pong:rooms_active
            expr: pong_rooms_active
          - record: belacca:pong:websockets_active
            expr: pong_websockets_active
          - record: belacca:flux:reconciliation_failures:rate5m
            expr: sum(rate(gotk_reconcile_condition{status="False",type="Ready"}[5m]))
      - name: belacca-slo-alerts
        interval: 30s
        rules:
          # Candidate burn-rate alerts. They remain warning-level until the
          # service SLO is measured and an operator destination is configured.
          - alert: BelaccaPongErrorBudgetBurnFast
            expr: belacca:pong:http_error_ratio:rate5m > 0.05
            for: 10m
            labels:
              severity: warning
              slo_status: proposed
            annotations:
              summary: Pong HTTP error ratio is consuming the proposed budget
              runbook: https://github.com/macel94/belacca-gitops/blob/main/docs/RELIABILITY.md#pong
          - alert: BelaccaPongErrorBudgetBurnSlow
            expr: |
              (sum(rate(pong_http_requests_failure_total[6h])) / clamp_min(sum(rate(pong_http_requests_total[6h])), 1)) > 0.005
            for: 1h
            labels:
              severity: warning
              slo_status: proposed
            annotations:
              summary: Pong sustained HTTP error ratio is above the proposed SLO budget
              runbook: https://github.com/macel94/belacca-gitops/blob/main/docs/RELIABILITY.md#pong
          - alert: BelaccaFluxReconciliationFailure
            expr: belacca:flux:reconciliation_failures:rate5m > 0
            for: 10m
            labels:
              severity: warning
              slo_status: diagnostic
            annotations:
              summary: A Flux controller reports a Ready condition failure
              runbook: https://github.com/macel94/belacca-gitops/blob/main/docs/RELIABILITY.md#flux-and-notifications
