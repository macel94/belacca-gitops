apiVersion: v1
kind: Namespace
metadata:
  name: analytics
  labels:
    belacca.com/project: analytics
    app.kubernetes.io/part-of: belacca-platform
  annotations:
    # Keep the analytics database available if the Flux resource is ever
    # removed during a migration. Delete it deliberately when the data is no
    # longer needed.
    kustomize.toolkit.fluxcd.io/prune: disabled
