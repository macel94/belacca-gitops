apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: analytics-oauth2-proxy
  namespace: analytics
  labels:
    belacca.com/project: analytics
    belacca.com/component: analytics-auth
spec:
  interval: 10m
  chart:
    spec:
      chart: oauth2-proxy
      version: "10.7.0"
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
        namespace: analytics
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    config:
      existingSecret: analytics-dex-oauth
      emailDomains:
        - gmail.com
      upstreams:
        - http://goatcounter.analytics.svc.cluster.local:80
    authenticatedEmailsFile:
      enabled: true
      persistence: configmap
      restricted_access: |
        belakkuz@gmail.com
    extraArgs:
      provider: oidc
      oidc-issuer-url: https://dex.belacca.com
      redirect-url: https://stats.belacca.com/oauth2/callback
      scope: openid email profile
      reverse-proxy: true
      trusted-proxy-ip: 10.42.0.0/16
      set-xauthrequest: true
      pass-user-headers: true
      cookie-secure: true
      cookie-samesite: lax
      skip-provider-button: true
      # /count and /count.js are public collector paths; the ingress keeps
      # them on the direct GoatCounter Service instead of this proxy.
    service:
      type: ClusterIP
      portNumber: 80
    ingress:
      enabled: false
    serviceAccount:
      enabled: false
    securityContext:
      enabled: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 2000
      runAsGroup: 2000
      seccompProfile:
        type: RuntimeDefault
