apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 1
    persistence:
      enabled: true
      existingClaim: traefik-acme
      path: /data
    certificatesResolvers:
      letsencrypt:
        acme:
          email: francesco.belacca@hotmail.it
          storage: /data/acme.json
          # HTTP-01 is served on the public web entrypoint. Traefik's ACME
          # challenge router takes precedence over the ordinary HTTP→HTTPS
          # redirect routers, so port 80 remains usable for validation.
          httpChallenge:
            entryPoint: web
    additionalArguments:
      # The K3s-packaged chart can omit nested challenge values, so pass the
      # resolver explicitly to ensure Traefik enables HTTP-01 on web.
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
