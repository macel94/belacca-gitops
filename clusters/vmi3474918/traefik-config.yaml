apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 1
    persistence:
      enabled: true
      existingClaim: traefik-acme
      path: /data
    certificatesResolvers:
      letsencrypt:
        acme:
          email: francesco.belacca@hotmail.it
          storage: /data/acme.json
          # DNS-01 uses an ACME TXT record. The token is injected from the
          # out-of-band traefik-cloudflare Secret.
          dnsChallenge:
            provider: cloudflare
            resolvers:
              - 1.1.1.1:53
              - 8.8.8.8:53
    envFrom:
      - secretRef:
          name: traefik-cloudflare
