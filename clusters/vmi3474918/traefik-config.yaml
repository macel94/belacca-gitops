apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 1
    persistence:
      enabled: true
      existingClaim: traefik-acme
      path: /data
    certificatesResolvers:
      letsencrypt:
        acme:
          email: francesco.belacca@hotmail.it
          storage: /data/acme.json
          # TLS-ALPN-01 runs on the public websecure entrypoint and avoids
          # interference from the ordinary HTTP→HTTPS redirect routers.
          tlsChallenge: {}
    additionalArguments:
      # The K3s-packaged chart can omit nested challenge values, so pass the
      # resolver explicitly to ensure Traefik enables TLS-ALPN-01.
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
