apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 1
    persistence:
      enabled: true
      existingClaim: traefik-acme
      path: /data
    certificatesResolvers:
      letsencrypt:
        acme:
          email: francesco.belacca@hotmail.it
          storage: /data/acme.json
          # TLS-ALPN-01 avoids the Traefik 3 HTTP-01 challenge router, which
          # returned 404 behind this k3d entrypoint/redirect setup.
          tlsChallenge: {}
    additionalArguments:
      # The K3s-packaged chart drops an empty tlsChallenge map, so pass the
      # resolver explicitly to ensure Traefik enables TLS-ALPN-01.
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      # The k3s chart listens internally on :8443 but publishes HTTPS on :443.
      - --entryPoints.web.http.redirections.entryPoint.to=:443
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.web.http.redirections.entryPoint.permanent=true
