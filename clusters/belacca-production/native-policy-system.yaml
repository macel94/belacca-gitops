apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: native-policy-system
  namespace: flux-system
  labels:
    belacca.com/owner: native-root
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: admission-policy
spec:
  interval: 10m
  path: ./clusters/belacca-production/policy-system
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: native-image-policy
  namespace: flux-system
  labels:
    belacca.com/owner: native-root
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: admission-policy
spec:
  interval: 10m
  path: ./clusters/belacca-production/policies
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: native-policy-system
  sourceRef:
    kind: GitRepository
    name: flux-system
