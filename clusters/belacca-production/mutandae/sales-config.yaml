apiVersion: v1
kind: ConfigMap
metadata:
  name: mutandae-sales-config
  namespace: mutandae
data:
  MUTANDAE_AI_ENABLED: "true"
  MUTANDAE_AI_APPROVED: "true"
  MUTANDAE_AI_TENANTS: mutandae-sales
  MUTANDAE_EMAIL_ENABLED: "true"
  MUTANDAE_EMAIL_APPROVED: "true"
  MUTANDAE_EMAIL_TENANTS: mutandae-sales
  MUTANDAE_EMAIL_ORIGIN: https://mutandae.com
  MUTANDAE_EMAIL_FROM: forms@notify.mutandae.com
  # File-backed token revocation is already supported by the application.
  # Release verification starts with one scoped digest; it is emptied afterward.
  MUTANDAE_API_TOKENS_FILE: /etc/mutandae/api-tokens/tokens.json
