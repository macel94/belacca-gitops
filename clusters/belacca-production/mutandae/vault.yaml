apiVersion: v1
kind: ConfigMap
metadata:
  name: mutandae-vault-config
  namespace: mutandae
  labels:
    app.kubernetes.io/name: mutandae-vault
    belacca.com/project: mutandae
    belacca.com/component: vault
data:
  vault.hcl: |
    # Cluster-local demo vault for Mutandae credential delivery. This is the
    # common vault of the demo: provisioned and renewed credentials are
    # mirrored here so they persist in the cluster under audit. It holds only
    # zero-permission demo identity credentials — never customer material.
    ui = true
    disable_mlock = true

    storage "raft" {
      path    = "/vault/data"
      node_id = "mutandae-vault-0"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = 1
    }

    api_addr     = "http://mutandae-vault.mutandae.svc.cluster.local:8200"
    cluster_addr = "http://mutandae-vault-0.mutandae-vault-headless.mutandae.svc.cluster.local:8201"
    log_level    = "warn"
---
apiVersion: v1
kind: Service
metadata:
  name: mutandae-vault
  namespace: mutandae
  labels:
    app.kubernetes.io/name: mutandae-vault
    belacca.com/project: mutandae
    belacca.com/component: vault
spec:
  selector:
    app.kubernetes.io/name: mutandae-vault
  ports:
    - name: api
      port: 8200
      targetPort: api
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: mutandae-vault-headless
  namespace: mutandae
  labels:
    app.kubernetes.io/name: mutandae-vault
    belacca.com/project: mutandae
    belacca.com/component: vault
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mutandae-vault
  ports:
    - name: api
      port: 8200
      targetPort: api
    - name: raft
      port: 8201
      targetPort: raft
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mutandae-vault
  namespace: mutandae
  labels:
    app.kubernetes.io/name: mutandae-vault
    belacca.com/project: mutandae
    belacca.com/component: vault
    belacca.com/stage: native-production
spec:
  serviceName: mutandae-vault-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mutandae-vault
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mutandae-vault
        belacca.com/project: mutandae
        belacca.com/component: vault
        belacca.com/stage: native-production
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault
          image: hashicorp/vault:1.21.4@sha256:6c77f568e6b6310d5bc68befb5711b9215c574de7da489e7c24332581176888b
          imagePullPolicy: IfNotPresent
          command: ["vault"]
          args: ["server", "-config=/vault/config/vault.hcl"]
          ports:
            - name: api
              containerPort: 8200
            - name: raft
              containerPort: 8201
          env:
            - name: HOME
              value: /vault/shared
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
          volumeMounts:
            - name: config
              mountPath: /vault/config
              readOnly: true
            - name: data
              mountPath: /vault/data
            - name: shared
              mountPath: /vault/shared
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          # sys/health returns 200 when active and unsealed, 503 when sealed
          # or uninitialized, so readiness tracks serving state without
          # restarting the pod; liveness softens sealed/uninitialized to 204
          # because the unseal sidecar owns recovery in that case.
          startupProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: api
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: api
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: api
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: unseal
          image: hashicorp/vault:1.21.4@sha256:6c77f568e6b6310d5bc68befb5711b9215c574de7da489e7c24332581176888b
          imagePullPolicy: IfNotPresent
          # Self-healing demo recovery: whenever the server reports itself
          # sealed, unseal it with the key share from the SOPS-managed Secret.
          # Initialization stays a deliberate operator runbook step (see
          # docs/hosted-demo-gitops.md in the application repository) so the
          # raft store is never silently re-created.
          command: ["sh", "-ec"]
          args:
            - |
              export VAULT_ADDR=http://127.0.0.1:8200
              while :; do
                status="$(vault status -format=json 2>/dev/null || true)"
                if [ -n "$status" ]; then
                  if printf '%s' "$status" | grep -q '"initialized": false'; then
                    echo "vault is uninitialized; waiting for the operator runbook" >&2
                  elif printf '%s' "$status" | grep -q '"sealed": true'; then
                    vault operator unseal "$UNSEAL_KEY" >/dev/null 2>&1 \
                      && echo "vault unsealed" >&2 \
                      || echo "unseal failed; retrying" >&2
                  fi
                fi
                sleep 10
              done
          env:
            - name: HOME
              value: /vault/shared
            - name: UNSEAL_KEY
              valueFrom:
                secretKeyRef:
                  name: mutandae-vault-unseal
                  key: UNSEAL_KEY
                  optional: true
          volumeMounts:
            - name: shared
              mountPath: /vault/shared
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: mutandae-vault-config
        - name: shared
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: mutandae-vault
          belacca.com/project: mutandae
          belacca.com/component: vault
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
