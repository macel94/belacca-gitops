apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-native-config
  namespace: observability
  labels:
    belacca.com/stage: native-production
    belacca.com/project: observability
    belacca.com/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        platform: belacca
        cluster: belacca-native
    rule_files:
      - /etc/prometheus/rules/*.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: [alertmanager-native.observability.svc.cluster.local:9093]
    scrape_configs:
      # Native Pong aggregate metrics are diagnostics, not the external 99% SLI.
      - job_name: native-pong-api-diagnostic
        metrics_path: /metrics
        static_configs:
          - targets: [pong-api.pong.svc.cluster.local:8080]
            labels:
              service: pong
              signal: native-diagnostic
        sample_limit: 100
      # Flux controller metrics are diagnostics about reconciliation machinery.
      - job_name: native-flux-controllers-diagnostic
        metrics_path: /metrics
        static_configs:
          - targets:
              - source-controller.flux-system.svc.cluster.local:80
              - kustomize-controller.flux-system.svc.cluster.local:80
              - helm-controller.flux-system.svc.cluster.local:80
              - notification-controller.flux-system.svc.cluster.local:80
            labels:
              service: flux
              signal: native-diagnostic
        sample_limit: 500
      - job_name: native-backup-diagnostic
        metrics_path: /metrics
        static_configs:
          - targets: [backup-metrics.backup-system.svc.cluster.local:9091]
            labels:
              service: backup
              signal: native-diagnostic
        sample_limit: 100
      # The external synthetic source and status Git repository are intentionally
      # not scraped here. Internal metrics cannot stand in for public availability.
      # This is also an ingestion boundary, not a scrape of the status Git
      # repository. The status Git repository is intentionally not scraped by
      # native Prometheus. The endpoint is intentionally not deployed by this slice;
      # an operator must provision a private, Flux-owned adapter that exposes
      # only the contract in synthetic-contracts.json. Until then this target
      # is down and all SLO series remain absent or zero-coverage.
      - job_name: native-slo-evidence-boundary
        metrics_path: /metrics
        static_configs:
          - targets: [slo-evidence-adapter.observability.svc.cluster.local:8080]
            labels:
              signal: external-slo-evidence
        sample_limit: 100
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: belacca_slo_observation_events_total
            action: keep
          - source_labels: [service]
            regex: portfolio|pong|analytics
            action: keep
          - source_labels: [outcome]
            regex: good|bad
            action: keep
          - regex: ^(__name__|service|outcome)$
            action: labelkeep
  prometheus.rules.yml: |
    groups:
      - name: belacca-native-diagnostic-recording
        interval: 30s
        rules:
          - record: belacca:native:pong:http_requests:rate5m
            expr: sum(rate(pong_http_requests_total[5m]))
          - record: belacca:native:pong:http_failures:rate5m
            expr: sum(rate(pong_http_requests_failure_total[5m]))
          - record: belacca:native:pong:http_error_ratio:rate5m
            expr: belacca:native:pong:http_failures:rate5m / clamp_min(belacca:native:pong:http_requests:rate5m, 1)
          - record: belacca:native:pong:rooms_active
            expr: pong_rooms_active
          - record: belacca:native:pong:websockets_active
            expr: pong_websockets_active
          - record: belacca:native:flux:reconciliation_failures:rate5m
            expr: sum(rate(gotk_reconcile_condition{status="False",type="Ready"}[5m]))
      # The native cluster runs standalone Prometheus rather than Prometheus
      # Operator. Keep Pong capacity alerts in this file-based rule bundle;
      # the application overlay must not emit a PrometheusRule CRD object.
      - name: cloudnativepong-capacity
        interval: 30s
        rules:
          - alert: PongAdmissionRejections
            expr: sum(rate(pong_admission_http_rejected_total[5m])) + sum(rate(pong_admission_create_rejected_total[5m])) + sum(rate(pong_admission_join_rejected_total[5m])) + sum(rate(pong_admission_websocket_rejected_total[5m])) > 0
            for: 10m
            labels: {severity: warning, notification_class: capacity}
            annotations:
              summary: Pong is shedding excess work
              description: Admission rejection has persisted; compare it with resource and latency signals before increasing limits.
          - alert: PongWebSocketAdmissionHeadroomLow
            expr: pong_websockets_active > 102
            for: 10m
            labels: {severity: warning, notification_class: capacity}
            annotations:
              summary: Pong WebSocket headroom is below 20 percent
              description: Active sessions exceed the safe 80 percent threshold of the configured global limit.
          - alert: PongRoomQuotaHeadroomLow
            expr: pong_rooms_active > 92
            for: 10m
            labels: {severity: warning, notification_class: capacity}
            annotations:
              summary: Pong room quota headroom is below 20 percent
              description: Active rooms exceed the review threshold derived from the pod/service quota.
          - alert: PongAPIResourcePressure
            expr: (sum by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{namespace="pong", pod=~"pong-api-.*", container="api"}[5m])) / on (namespace, pod, container) kube_pod_container_resource_requests{namespace="pong", pod=~"pong-api-.*", container="api", resource="cpu", unit="core"}) > 0.8 or (container_memory_working_set_bytes{namespace="pong", pod=~"pong-api-.*", container="api"} / on (namespace, pod, container) kube_pod_container_resource_limits{namespace="pong", pod=~"pong-api-.*", container="api", resource="memory", unit="byte"}) > 0.8
            for: 10m
            labels: {severity: warning, notification_class: capacity}
            annotations:
              summary: Pong API resource headroom is below 20 percent
              description: The single SQLite writer is above its configured CPU request or near its memory limit; do not scale API replicas horizontally.
          - alert: PongSQLiteFailures
            expr: increase(pong_sqlite_create_failure_total[5m]) + increase(pong_sqlite_get_failure_total[5m]) + increase(pong_sqlite_list_failure_total[5m]) + increase(pong_sqlite_increment_players_failure_total[5m]) + increase(pong_sqlite_delete_failure_total[5m]) > 0
            for: 5m
            labels: {severity: critical, notification_class: capacity}
            annotations:
              summary: Pong SQLite operations are failing
              description: Protect existing rooms and investigate persistence or storage faults.
          - alert: PongHTTPServerErrors
            expr: sum(rate(pong_http_responses_5xx_total[5m])) / clamp_min(sum(rate(pong_http_requests_total[5m])), 1) > 0.01
            for: 10m
            labels: {severity: critical, notification_class: capacity}
            annotations:
              summary: Pong HTTP server error ratio is elevated
              description: Overload rejects should remain 429, not cascade into 5xx.
      - name: belacca-native-backup-alerts
        interval: 30s
        rules:
          - alert: NativeBackupStale
            expr: (time() - belacca_backup_last_success_timestamp_seconds > 93600) and on() (belacca_backup_configuration_ready == 1)
            for: 15m
            labels: {severity: critical, notification_class: backup}
            annotations:
              summary: "Native {{ $labels.exported_service }} backup is stale"
              runbook: docs/BACKUP-RUNBOOK.md
          - alert: NativeBackupIntegrityFailed
            expr: (belacca_backup_integrity_ok < 1) and on() (belacca_backup_configuration_ready == 1)
            for: 5m
            labels: {severity: critical, notification_class: backup}
            annotations:
              summary: "Native {{ $labels.exported_service }} backup integrity verification failed"
              runbook: docs/BACKUP-RUNBOOK.md
          - alert: NativeBackupDailyRetentionLow
            expr: (belacca_backup_daily_retention_count < 14) and on() (belacca_backup_configuration_ready == 1)
            for: 1h
            labels: {severity: warning, notification_class: backup}
            annotations:
              summary: "Native {{ $labels.exported_service }} has fewer than 14 verified daily backups"
              runbook: docs/BACKUP-RUNBOOK.md
          - alert: NativeBackupConfigurationUnknown
            expr: belacca_backup_configuration_ready == 0
            for: 15m
            labels: {severity: warning, notification_class: backup}
            annotations:
              summary: "Native backup restore configuration is not ready"
              description: "The reliable immutable backup destination is provisioned, but restore Secret values or the reviewed runtime gates are unavailable; no production backup success is claimed."
              runbook: docs/BACKUP-RUNBOOK.md
          - alert: NativeBackupUploadOrVerificationMissing
            expr: belacca_backup_configuration_ready == 1 and absent(belacca_backup_last_success_timestamp_seconds)
            for: 30m
            labels: {severity: critical, notification_class: backup}
            annotations:
              summary: "Native backup metrics are absent; upload or verification may be failing"
              runbook: docs/BACKUP-RUNBOOK.md
          - record: belacca:native:target:up
            expr: |
              max by (job, service) (
                up{job=~"native-pong-api-diagnostic|native-flux-controllers-diagnostic|native-slo-evidence-boundary"}
              )
      - name: belacca-native-slo-recording
        interval: 1h
        rules:
          # The external adapter emits one counter increment per valid hourly
          # observation. A missing scrape therefore creates no good event.
          - record: belacca:slo:expected_slots:30d
            expr: |
              label_replace(vector(720), "service", "portfolio", "", "")
              or label_replace(vector(720), "service", "pong", "", "")
              or label_replace(vector(720), "service", "analytics", "", "")
          - record: belacca:slo:good_events:30d
            expr: |
              sum by (service) (increase(belacca_slo_observation_events_total{outcome="good"}[30d]))
              or on (service) (belacca:slo:expected_slots:30d * 0)
          - record: belacca:slo:total_events:30d
            expr: |
              sum by (service) (increase(belacca_slo_observation_events_total{outcome=~"good|bad"}[30d]))
              or on (service) (belacca:slo:expected_slots:30d * 0)
          - record: belacca:slo:data_coverage:30d
            expr: belacca:slo:total_events:30d / belacca:slo:expected_slots:30d
          - record: belacca:slo:sli:30d
            expr: |
              (
                belacca:slo:good_events:30d / belacca:slo:total_events:30d
              )
              and on (service) (belacca:slo:data_coverage:30d == 1)
              and on (service) (belacca:slo:total_events:30d > 0)
          - record: belacca:slo:error_budget:30d
            expr: |
              (
                1 - (belacca:slo:total_events:30d - belacca:slo:good_events:30d)
                / (belacca:slo:total_events:30d * 0.01)
              )
              and on (service) (belacca:slo:data_coverage:30d == 1)
              and on (service) (belacca:slo:total_events:30d > 0)
      - name: belacca-native-slo-source-readiness
        interval: 30s
        rules:
          # This series is deliberately zero until an adapter is provisioned;
          # it must never be interpreted as successful service observations.
          - record: belacca:slo_source:external_probe:coverage
            expr: vector(0)
            labels:
              source: external-durable-synthetic
              status: proposed
      - name: belacca-native-actionable-notification-signals
        interval: 30s
        rules:
          # These rules are intentionally dormant until an approved external
          # SLO collector provides the labelled series. No low-level Flux or
          # controller failure can page by itself.
          - record: belacca:native:slo:error_budget_burn:short
            expr: vector(0)
            labels:
              source: external-durable-synthetic
              status: proposed
              notification_class: page
          - record: belacca:native:slo:error_budget_burn:long
            expr: vector(0)
            labels:
              source: external-durable-synthetic
              status: proposed
              notification_class: page
          # The routing/storage gates are explicit inputs for a future
          # kube-state-metrics or edge/storage collector. Absent those inputs,
          # vector(0) fails closed and cannot create a false page.
          - record: belacca:native:routing:customer_impact
            expr: vector(0)
            labels:
              source: proposed-platform-health-gate
              status: proposed
              notification_class: page
          - record: belacca:native:storage:customer_impact
            expr: vector(0)
            labels:
              source: proposed-platform-health-gate
              status: proposed
              notification_class: page
          - alert: BelaccaNotificationPathNotProvisioned
            expr: belacca:slo_source:external_probe:coverage == 0
            for: 15m
            labels:
              severity: warning
              notification_class: diagnostic
              routing_class: ticket-dashboard
              page_policy: not-configured
            annotations:
              summary: Native notification/SLO path is not provisioned
              description: External SLO evidence and the page destination are not operational; use Flux status and the notification runbook.
              runbook: docs/NOTIFICATIONS.md
          - alert: BelaccaNativeSLOBurn
            expr: belacca:native:slo:error_budget_burn:short > 14.4 and belacca:native:slo:error_budget_burn:long > 6
            for: 5m
            labels:
              severity: critical
              notification_class: page
              routing_class: page
              page_policy: operator-signoff-required
            annotations:
              summary: Native public-service SLO is burning error budget
              description: Page only when the approved external SLO source asserts both short and long burn thresholds.
              runbook: docs/RELIABILITY.md
          - alert: BelaccaNativeRoutingImpact
            expr: belacca:native:routing:customer_impact > 0
            for: 10m
            labels:
              severity: critical
              notification_class: page
              routing_class: page
              page_policy: operator-signoff-required
            annotations:
              summary: Native routing has confirmed customer impact
              description: Page only after the independent routing health gate confirms impact; individual component errors remain diagnostic.
              runbook: docs/RELIABILITY.md
          - alert: BelaccaNativeStorageImpact
            expr: belacca:native:storage:customer_impact > 0
            for: 10m
            labels:
              severity: critical
              notification_class: page
              routing_class: page
              page_policy: operator-signoff-required
            annotations:
              summary: Native storage has confirmed customer impact
              description: Page only after the independent storage health gate confirms impact; one low-level Longhorn/PVC warning is not enough.
              runbook: docs/RELIABILITY.md
