apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-native-config
  namespace: observability
  labels:
    belacca.com/stage: native-production
    belacca.com/project: observability
    belacca.com/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        platform: belacca
        cluster: belacca-native
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      # Native Pong aggregate metrics are diagnostics, not the external 99% SLI.
      - job_name: native-pong-api-diagnostic
        metrics_path: /metrics
        static_configs:
          - targets: [pong-api.pong.svc.cluster.local:8080]
            labels:
              service: pong
              signal: native-diagnostic
        sample_limit: 100
      # Flux controller metrics are diagnostics about reconciliation machinery.
      - job_name: native-flux-controllers-diagnostic
        metrics_path: /metrics
        static_configs:
          - targets:
              - source-controller.flux-system.svc.cluster.local:80
              - kustomize-controller.flux-system.svc.cluster.local:80
              - helm-controller.flux-system.svc.cluster.local:80
              - notification-controller.flux-system.svc.cluster.local:80
            labels:
              service: flux
              signal: native-diagnostic
        sample_limit: 500
      # This is an ingestion boundary, not a scrape of the status Git
      # repository. The endpoint is intentionally not deployed by this slice;
      # an operator must provision a private, Flux-owned adapter that exposes
      # only the contract in synthetic-contracts.json. Until then this target
      # is down and all SLO series remain absent or zero-coverage.
      - job_name: native-slo-evidence-boundary
        metrics_path: /metrics
        static_configs:
          - targets: [slo-evidence-adapter.observability.svc.cluster.local:8080]
            labels:
              signal: external-slo-evidence
        sample_limit: 100
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: belacca_slo_observation_events_total
            action: keep
          - source_labels: [service]
            regex: portfolio|pong|analytics
            action: keep
          - source_labels: [outcome]
            regex: good|bad
            action: keep
          # The adapter contract is intentionally a two-label allowlist. This
          # drops all other labels, including any accidental high-cardinality
          # or private fields, before they reach the TSDB.
          - regex: ^(__name__|service|outcome)$
            action: labelkeep
  prometheus.rules.yml: |
    groups:
      - name: belacca-native-diagnostic-recording
        interval: 30s
        rules:
          - record: belacca:native:pong:http_requests:rate5m
            expr: sum(rate(pong_http_requests_total[5m]))
          - record: belacca:native:pong:http_failures:rate5m
            expr: sum(rate(pong_http_requests_failure_total[5m]))
          - record: belacca:native:pong:http_error_ratio:rate5m
            expr: belacca:native:pong:http_failures:rate5m / clamp_min(belacca:native:pong:http_requests:rate5m, 1)
          - record: belacca:native:pong:rooms_active
            expr: pong_rooms_active
          - record: belacca:native:pong:websockets_active
            expr: pong_websockets_active
          - record: belacca:native:flux:reconciliation_failures:rate5m
            expr: sum(rate(gotk_reconcile_condition{status="False",type="Ready"}[5m]))
          - record: belacca:native:target:up
            expr: |
              max by (job, service) (
                up{job=~"native-pong-api-diagnostic|native-flux-controllers-diagnostic|native-slo-evidence-boundary"}
              )
      - name: belacca-native-slo-recording
        interval: 1h
        rules:
          # The external adapter emits one counter increment per valid hourly
          # observation. A missing scrape therefore creates no good event.
          - record: belacca:slo:expected_slots:30d
            expr: |
              label_replace(vector(720), "service", "portfolio", "", "")
              or label_replace(vector(720), "service", "pong", "", "")
              or label_replace(vector(720), "service", "analytics", "", "")
          - record: belacca:slo:good_events:30d
            expr: |
              sum by (service) (increase(belacca_slo_observation_events_total{outcome="good"}[30d]))
              or on (service) (belacca:slo:expected_slots:30d * 0)
          - record: belacca:slo:total_events:30d
            expr: |
              sum by (service) (increase(belacca_slo_observation_events_total{outcome=~"good|bad"}[30d]))
              or on (service) (belacca:slo:expected_slots:30d * 0)
          - record: belacca:slo:data_coverage:30d
            expr: belacca:slo:total_events:30d / belacca:slo:expected_slots:30d
          - record: belacca:slo:sli:30d
            expr: |
              (
                belacca:slo:good_events:30d / belacca:slo:total_events:30d
              )
              and on (service) (belacca:slo:data_coverage:30d == 1)
              and on (service) (belacca:slo:total_events:30d > 0)
          - record: belacca:slo:error_budget:30d
            expr: |
              (
                1 - (belacca:slo:total_events:30d - belacca:slo:good_events:30d)
                / (belacca:slo:total_events:30d * 0.01)
              )
              and on (service) (belacca:slo:data_coverage:30d == 1)
              and on (service) (belacca:slo:total_events:30d > 0)
      - name: belacca-native-slo-source-readiness
        interval: 30s
        rules:
          # This series is deliberately zero until an adapter is provisioned;
          # it must never be interpreted as successful service observations.
          - record: belacca:slo_source:external_probe:coverage
            expr: vector(0)
            labels:
              source: external-durable-synthetic
              status: proposed
