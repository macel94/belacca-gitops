# Runtime interface only. The Secret must be provisioned out of band.
# Do not create an empty placeholder: Alertmanager must not appear healthy
# while Telegram delivery is impossible.
#
# Secret: observability/alertmanager-telegram
# Required keys:
#   bot-token: Telegram Bot API token from BotFather
#   chat-id: Telegram numeric chat ID (string form is accepted)
#
# Provision with a protected operator process, for example:
# kubectl -n observability create secret generic alertmanager-telegram \
#   --from-literal=bot-token="$TELEGRAM_BOT_TOKEN" \
#   --from-literal=chat-id="$TELEGRAM_CHAT_ID"
