apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-native
  namespace: observability
  annotations:
    # Recreate this single-writer Deployment when changing away from the
    # historical RollingUpdate strategy; do not enable force globally.
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    belacca.com/stage: native-production
    belacca.com/project: observability
    belacca.com/component: prometheus
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  # Prometheus uses a single-writer RWO TSDB PVC. Never overlap old and new
  # Pods during an update or the second process exits on the TSDB lock.
  strategy:
    rollingUpdate: null
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      belacca.com/stage: native-production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        belacca.com/stage: native-production
        belacca.com/project: observability
        belacca.com/component: prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          # Deliberately reused historical multi-architecture pin; revalidate
          # the digest against the official registry before native rollout or upgrade.
          image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=45d
            - --storage.tsdb.retention.size=4GB
            - --web.listen-address=:9090
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: prometheus-native-config
            items:
              - key: prometheus.yml
                path: prometheus.yml
        - name: rules
          configMap:
            name: prometheus-native-config
            items:
              - key: prometheus.rules.yml
                path: prometheus.rules.yml
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-native-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-native
  namespace: observability
  labels:
    belacca.com/stage: native-production
    belacca.com/project: observability
    belacca.com/component: prometheus
    app.kubernetes.io/name: prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
    belacca.com/stage: native-production
  ports:
    - name: http
      port: 9090
      targetPort: http
