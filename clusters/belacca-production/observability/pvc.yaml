apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-native-data
  namespace: observability
  labels:
    belacca.com/stage: native-production
    belacca.com/project: observability
    belacca.com/component: prometheus
  annotations:
    # Prometheus history is diagnostic only; preserve more than the 30-day SLO window.
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  storageClassName: longhorn
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
