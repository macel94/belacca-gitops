apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-native-config
  namespace: observability
  labels:
    belacca.com/stage: native-production
    belacca.com/project: observability
    belacca.com/component: alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: telegram
      group_by: [cluster, alertname, service, namespace, name]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: telegram
          matchers:
            - notificationClass="diagnostic"
          group_wait: 2m
          repeat_interval: 12h
        - receiver: telegram
          matchers:
            - notification_class="diagnostic"
          group_wait: 2m
          repeat_interval: 12h
        - receiver: telegram
          matchers:
            - notificationClass="page"
          group_wait: 30s
          repeat_interval: 2h
        - receiver: telegram
          matchers:
            - notification_class="page"
          group_wait: 30s
          repeat_interval: 2h
    inhibit_rules:
      - source_matchers:
          - notificationClass="page"
        target_matchers:
          - notificationClass="diagnostic"
        equal: [cluster, alertname, service, namespace, name]
      - source_matchers:
          - notification_class="page"
        target_matchers:
          - notification_class="diagnostic"
        equal: [cluster, alertname, service, namespace, name]
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: [cluster, alertname, service, namespace, name]
    receivers:
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/bot-token
            chat_id_file: /etc/alertmanager/secrets/chat-id
            send_resolved: true
            parse_mode: ''
            message: |-
              {{ if eq .Status "firing" }}🚨 Belacca alert{{ else }}✅ Belacca recovery{{ end }}
              {{ range .Alerts }}
              {{ .Labels.alertname }}
              {{- if .Labels.service }} · {{ .Labels.service }}{{ end }}
              {{- if .Labels.namespace }}/{{ .Labels.namespace }}{{ end }}
              {{- if .Labels.name }}/{{ .Labels.name }}{{ end }}
              {{ if .Annotations.summary }}
              {{ .Annotations.summary }}
              {{ end }}{{ if .Annotations.description }}
              {{ .Annotations.description }}
              {{ end }}{{ end }}
