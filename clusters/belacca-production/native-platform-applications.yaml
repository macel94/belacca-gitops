apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: native-dex
  namespace: flux-system
  labels:
    belacca.com/owner: native-root
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: identity
spec:
  interval: 10m
  path: ./clusters/belacca-production/dex
  prune: true
  wait: true
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
---
