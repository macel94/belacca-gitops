apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dex-traffic
  namespace: dex
  labels:
    belacca.com/stage: native-staging
    belacca.com/project: platform
    belacca.com/component: identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dex
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 5556
