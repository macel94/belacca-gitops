apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dex-traffic
  namespace: dex
  labels:
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dex
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - ipBlock:
            cidr: 169.58.143.41/32
        - ipBlock:
            cidr: 169.58.143.42/32
        # Traefik uses hostNetwork; these are node source addresses, not Pod
        # CIDRs. Do not add a broad cluster/pod CIDR to this identity edge.
        - ipBlock:
            cidr: 169.58.97.73/32
      ports:
        - protocol: TCP
          port: 5556
