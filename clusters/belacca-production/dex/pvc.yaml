apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dex-data
  namespace: dex
  labels:
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: identity
  annotations:
    # Dex stores signing keys and OIDC session state here. Keep it through
    # Flux ownership changes and delete it only as an explicit identity reset.
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  storageClassName: longhorn
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
