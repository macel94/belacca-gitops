apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
  namespace: dex
  labels:
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: identity
  annotations:
    # Names reserved for a future native routing inventory. This application
    # inventory intentionally does not create routes or certificates.
    belacca.com/native-route-names: native-dex,native-dashboard-dex
    belacca.com/native-tls-secret-names: native-dex-tls,native-dashboard-tls
spec:
  interval: 10m
  chart:
    spec:
      chart: dex
      version: "0.24.1"
      sourceRef:
        kind: HelmRepository
        name: dex
        namespace: dex
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    revisionHistoryLimit: 2
    # Dex uses a single-writer SQLite PVC; never overlap old/new Pods during an upgrade.
    strategy:
      type: Recreate
    configSecret:
      create: true
      name: dex-config
    config:
      # Keep the existing OIDC contract until native TLS and routing are
      # separately reviewed. The native route inventory owns exposure later.
      issuer: https://dashboard.belacca.com/oauth2
      storage:
        type: sqlite3
        config:
          file: /var/dex/dex.db
      oauth2:
        skipApprovalScreen: true
      staticClients:
        - id: flux-web
          name: Flux Web UI
          redirectURIs:
            - https://flux.belacca.com/oauth2/callback
        - id: headlamp
          name: Headlamp
          redirectURIs:
            - https://dashboard.belacca.com/headlamp-auth/callback
        - id: stats
          name: Analytics dashboard
          redirectURIs:
            - https://stats.belacca.com/oauth2/callback
        - id: azure-without-azure
          name: Azure Without Azure
          redirectURIs:
            - https://azure.belacca.com/auth/callback
      connectors:
        - type: google
          id: google
          name: Google
          config:
            redirectURI: https://dashboard.belacca.com/oauth2/callback
            promptType: ""
    volumes:
      - name: dex-data
        persistentVolumeClaim:
          claimName: dex-data
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: dex-data
        mountPath: /var/dex
      - name: tmp
        mountPath: /tmp
    rbac:
      create: false
      createClusterScoped: false
    podSecurityContext:
      fsGroup: 1001
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    networkPolicy:
      enabled: false
  valuesFrom:
    - kind: Secret
      name: dex-google-oauth
      valuesKey: client-id
      targetPath: config.connectors[0].config.clientID
      literal: true
    - kind: Secret
      name: dex-google-oauth
      valuesKey: client-secret
      targetPath: config.connectors[0].config.clientSecret
      literal: true
    - kind: Secret
      name: dex-client-secrets
      valuesKey: flux-web-client-secret
      targetPath: config.staticClients[0].secret
      literal: true
    - kind: Secret
      name: dex-client-secrets
      valuesKey: headlamp-client-secret
      targetPath: config.staticClients[1].secret
      literal: true
    - kind: Secret
      name: dex-client-secrets
      valuesKey: stats-client-secret
      targetPath: config.staticClients[2].secret
      literal: true
    - kind: Secret
      name: dex-client-secrets
      valuesKey: azure-without-azure-client-secret
      targetPath: config.staticClients[3].secret
      literal: true
