apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp-oauth2-proxy
  namespace: headlamp
  labels:
    belacca.com/stage: native-staging
    belacca.com/project: platform
    belacca.com/component: headlamp-auth
  annotations:
    # Reserved for a future native routing inventory; no route is created here.
    belacca.com/native-route-name: native-headlamp
    belacca.com/native-tls-secret-name: native-dashboard-tls
spec:
  interval: 10m
  chart:
    spec:
      chart: oauth2-proxy
      version: "10.7.0"
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
        namespace: headlamp
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    config:
      existingSecret: headlamp-dex-oauth
      emailDomains:
        - gmail.com
      upstreams:
        - http://headlamp.headlamp.svc.cluster.local:80
    authenticatedEmailsFile:
      enabled: true
      persistence: configmap
      restricted_access: |
        belakkuz@gmail.com
    extraArgs:
      provider: oidc
      oidc-issuer-url: https://dashboard.belacca.com/oauth2
      redirect-url: https://dashboard.belacca.com/headlamp-auth/callback
      proxy-prefix: /headlamp-auth
      scope: openid email profile
      reverse-proxy: true
      trusted-proxy-ip: 10.42.0.0/16
      set-xauthrequest: true
      pass-user-headers: true
      cookie-secure: true
      cookie-samesite: lax
      skip-provider-button: true
    service:
      type: ClusterIP
      portNumber: 80
    ingress:
      enabled: false
    serviceAccount:
      enabled: false
    securityContext:
      enabled: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 2000
      runAsGroup: 2000
      seccompProfile:
        type: RuntimeDefault
