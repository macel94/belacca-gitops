apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: dashboard
  annotations:
    # Reserved for a future native routing inventory; no route is created here.
    belacca.com/native-route-name: native-headlamp
    belacca.com/native-tls-secret-name: native-dashboard-tls
spec:
  interval: 10m
  chart:
    spec:
      chart: headlamp
      version: "0.44.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: headlamp
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    config:
      inCluster: true
      # OAuth2 Proxy is the trusted public identity boundary. Headlamp uses
      # its official identity-aware proxy mode and the mounted ServiceAccount
      # token for the shared backend identity.
      unsafeUseServiceAccountToken: true
      enableHelm: false
      extraArgs:
        - "-proxy-auth=true"
      oidc:
        secret:
          create: false
      clusterInventory:
        enabled: false
    serviceAccount:
      create: true
      name: headlamp
    clusterRoleBinding:
      create: true
      clusterRoleName: headlamp-read-only
    service:
      type: ClusterIP
    ingress:
      enabled: false
    automountServiceAccountToken: true
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101
      seccompProfile:
        type: RuntimeDefault
