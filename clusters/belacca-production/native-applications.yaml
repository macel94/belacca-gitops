apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pong
  namespace: flux-system
  labels:
    belacca.com/owner: native-root
    belacca.com/project: pong
spec:
  interval: 10m
  path: ./k8s/overlays/native-staging
  prune: false
  wait: true
  timeout: 10m
  dependsOn:
    - name: flux-system
    - name: native-image-policy
  sourceRef:
    kind: GitRepository
    name: cloudnativepong
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portfolio
  namespace: flux-system
  labels:
    belacca.com/owner: native-root
    belacca.com/project: portfolio
spec:
  interval: 10m
  path: ./deploy
  prune: false
  wait: true
  timeout: 10m
  dependsOn:
    - name: flux-system
    - name: native-image-policy
  sourceRef:
    kind: GitRepository
    name: francesco-belacca-site
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mutandae
  namespace: flux-system
  labels:
    belacca.com/owner: native-root
    belacca.com/project: mutandae
spec:
  interval: 10m
  path: ./deploy/k3s
  prune: false
  wait: true
  timeout: 10m
  dependsOn:
    - name: flux-system
    - name: native-image-policy
  sourceRef:
    kind: GitRepository
    name: mutandae
