apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pong
  namespace: flux-system
  labels:
    belacca.com/owner: native-root
    belacca.com/project: pong
spec:
  interval: 10m
  # The application repository retains this path for compatibility; the live
  # deployment is native production, not a staging environment.
  path: ./k8s/overlays/native-staging
  prune: false
  wait: true
  timeout: 10m
  dependsOn:
    - name: flux-system
    - name: native-image-policy
  sourceRef:
    kind: GitRepository
    name: cloudnativepong
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portfolio
  namespace: flux-system
  labels:
    belacca.com/owner: native-root
    belacca.com/project: portfolio
spec:
  interval: 10m
  path: ./deploy
  prune: false
  wait: true
  timeout: 10m
  dependsOn:
    - name: flux-system
    - name: native-image-policy
  sourceRef:
    kind: GitRepository
    name: francesco-belacca-site
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: azure-without-azure
  namespace: flux-system
  labels:
    belacca.com/owner: native-root
    belacca.com/project: azure-without-azure
    belacca.com/component: application
spec:
  interval: 10m
  path: ./deploy
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: flux-system
    - name: native-image-policy
    - name: native-azure-without-azure
  sourceRef:
    kind: GitRepository
    name: azure-without-azure
