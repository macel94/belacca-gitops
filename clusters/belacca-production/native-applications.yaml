apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pong
  namespace: flux-system
  labels:
    belacca.com/owner: native-root
    belacca.com/project: pong
spec:
  interval: 10m
  path: ./k8s/overlays/native-staging
  prune: false
  wait: true
  timeout: 10m
  dependsOn:
    - name: flux-system
    - name: native-image-policy
  sourceRef:
    kind: GitRepository
    name: cloudnativepong
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portfolio
  namespace: flux-system
  labels:
    belacca.com/owner: native-root
    belacca.com/project: portfolio
spec:
  interval: 10m
  path: ./deploy
  prune: false
  wait: true
  timeout: 10m
  dependsOn:
    - name: flux-system
    - name: native-image-policy
  sourceRef:
    kind: GitRepository
    name: francesco-belacca-site
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mutandae
  namespace: flux-system
  labels:
    belacca.com/owner: native-root
    belacca.com/project: mutandae
spec:
  interval: 10m
  path: ./deploy/k3s
  # Environment-variable ConfigMap updates need a new pod, not merely a
  # crashed-container retry. Bump this revision with live provider config.
  patches:
    - target:
        kind: Deployment
        name: mutandae
      patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: mutandae
        spec:
          template:
            metadata:
              annotations:
                mutandae.com/provider-config-revision: "2026-10-08-bare-sender"
  prune: false
  wait: true
  timeout: 10m
  dependsOn:
    - name: flux-system
    - name: native-image-policy
  sourceRef:
    kind: GitRepository
    name: mutandae
