apiVersion: v1
kind: Service
metadata:
  name: postgresql
  labels:
    app: postgresql
    belacca.com/stage: native-production
    belacca.com/project: azure-without-azure
    belacca.com/component: database
spec:
  selector:
    app: postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  labels:
    app: postgresql
    belacca.com/stage: native-production
    belacca.com/project: azure-without-azure
    belacca.com/component: database
spec:
  serviceName: postgresql
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        belacca.com/stage: native-production
        belacca.com/project: azure-without-azure
        belacca.com/component: database
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: docker.io/library/postgres:18.6-alpine3.23@sha256:8810a63e526404041442acb4d96b8d882dffd544df9c43f2ea59deac2004628f
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: awa
            - name: POSTGRES_DB
              value: azure_without_azure
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: azure-without-azure-runtime
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            readOnlyRootFilesystem: false
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U awa -d azure_without_azure"]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U awa -d azure_without_azure"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U awa -d azure_without_azure"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
          helm.sh/resource-policy: keep
        labels:
          belacca.com/stage: native-production
          belacca.com/project: azure-without-azure
          belacca.com/component: database
      spec:
        storageClassName: longhorn
        volumeMode: Filesystem
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
