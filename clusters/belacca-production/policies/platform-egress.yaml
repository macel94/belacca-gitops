---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: native-analytics-auth-egress
  namespace: analytics
  labels:
    belacca.com/stage: native-production
    belacca.com/project: analytics
    belacca.com/component: analytics-auth
spec:
  podSelector:
    matchLabels:
      app: oauth2-proxy
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Dex is reached through the path-scoped public issuer. The public DNS
    # contract is three native node addresses; no broad external CIDR is used.
    - to:
        - ipBlock:
            cidr: 169.58.97.73/32
        - ipBlock:
            cidr: 169.58.143.41/32
        - ipBlock:
            cidr: 169.58.143.42/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - podSelector:
            matchLabels:
              app: goatcounter
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: native-headlamp-auth-egress
  namespace: headlamp
  labels:
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: headlamp-auth
spec:
  podSelector:
    matchLabels:
      app: oauth2-proxy
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 169.58.97.73/32
        - ipBlock:
            cidr: 169.58.143.41/32
        - ipBlock:
            cidr: 169.58.143.42/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: headlamp
              app.kubernetes.io/instance: headlamp
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 4466
