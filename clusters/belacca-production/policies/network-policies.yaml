---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: native-headlamp-default-deny
  namespace: headlamp
  labels:
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: native-headlamp-auth-ingress
  namespace: headlamp
  labels:
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: headlamp-auth
spec:
  podSelector:
    matchLabels:
      app: oauth2-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        # Cross-node host-network forwarding is represented by exact flannel
        # interface /32s; retain public node /32s for source-preserving paths.
        - ipBlock:
            cidr: 10.42.0.0/32
        - ipBlock:
            cidr: 10.42.1.0/32
        - ipBlock:
            cidr: 10.42.2.0/32
        - ipBlock:
            cidr: 169.58.97.73/32
        - ipBlock:
            cidr: 169.58.143.41/32
        - ipBlock:
            cidr: 169.58.143.42/32
      ports:
        - protocol: TCP
          port: 4180
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: native-headlamp-backend-ingress
  namespace: headlamp
  labels:
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: headlamp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp
      app.kubernetes.io/instance: headlamp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: oauth2-proxy
      ports:
        - protocol: TCP
          port: 4466
---
