apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-metrics
  namespace: backup-system
  labels: {belacca.com/stage: native-production, belacca.com/project: backup, belacca.com/component: metrics}
spec:
  replicas: 1
  selector: {matchLabels: {app: backup-metrics}}
  template:
    metadata:
      labels: {app: backup-metrics, belacca.com/stage: native-production, belacca.com/project: backup}
      annotations:
        belacca.com/runner-contract: configuration-aware-v3
    spec:
      serviceAccountName: backup-restore-verifier
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: metrics
          image: python:3.13.11-slim-bookworm@sha256:20080e807bfc404f8450b185cf0fc95d553462673598549613735f70a5b4d5d0
          command: ["python3", "/opt/backup/backup_runner.py", "metrics-server"]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          # Metrics reads the externally managed restore interface but never
          # writes to object storage. It reports configuration_unknown until
          # that interface and both runtime gates are exactly true. Secret
          # values are managed out of band and are not committed here.
          env:
            - {name: BACKUP_AUTOMATION_ENABLED, valueFrom: {secretKeyRef: {name: backup-restore-runtime, key: automation-enabled, optional: true}}}
            - {name: BACKUP_CONSISTENCY_ACKNOWLEDGED, valueFrom: {secretKeyRef: {name: backup-restore-runtime, key: consistency-acknowledged, optional: true}}}
            - {name: METRICS_PORT, value: "9091"}
            # Hourly refresh bounds S3 LIST/GET request volume (nightly data,
            # no need for 5-minute polling).
            - {name: METRICS_REFRESH_SECONDS, value: "3600"}
            - {name: S3_RESTORE_ENDPOINT, valueFrom: {secretKeyRef: {name: backup-restore-object-store, key: endpoint, optional: true}}}
            - {name: S3_RESTORE_BUCKET, valueFrom: {secretKeyRef: {name: backup-restore-object-store, key: bucket, optional: true}}}
            - {name: S3_RESTORE_PREFIX, valueFrom: {secretKeyRef: {name: backup-restore-object-store, key: prefix, optional: true}}}
            - {name: S3_RESTORE_REGION, valueFrom: {secretKeyRef: {name: backup-restore-object-store, key: region, optional: true}}}
            - {name: S3_RESTORE_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: backup-restore-object-store, key: access-key-id, optional: true}}}
            - {name: S3_RESTORE_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: backup-restore-object-store, key: secret-access-key, optional: true}}}
          ports: [{name: metrics, containerPort: 9091}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          readinessProbe: {httpGet: {path: /metrics, port: metrics}, periodSeconds: 30}
          volumeMounts: [{name: runner, mountPath: /opt/backup, readOnly: true}]
      volumes: [{name: runner, configMap: {name: backup-runner, defaultMode: 0444}}]
---
apiVersion: v1
kind: Service
metadata:
  name: backup-metrics
  namespace: backup-system
  labels: {belacca.com/stage: native-production, belacca.com/project: backup, belacca.com/component: metrics}
spec:
  type: ClusterIP
  selector: {app: backup-metrics}
  ports: [{name: metrics, port: 9091, targetPort: metrics}]
