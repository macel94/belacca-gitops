# Restore verification deliberately has no production PVC mount. Each run
# downloads one artifact into an ephemeral filesystem, checks it, and removes
# the plaintext copy when the Pod exits.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pong-restore-verification
  namespace: backup-system
  labels: {belacca.com/stage: native-production, belacca.com/project: backup, belacca.com/service: pong, belacca.com/component: restore-verifier}
spec:
  schedule: "47 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  # Failed runs remain observable briefly through TTL cleanup, but must not
  # accumulate as stale error Pods in the namespace.
  failedJobsHistoryLimit: 0
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 900
      template:
        metadata: {labels: {belacca.com/component: restore-verifier, belacca.com/service: pong}}
        spec:
          serviceAccountName: backup-restore-verifier
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: verifier
              image: python:3.13.11-slim-bookworm@sha256:20080e807bfc404f8450b185cf0fc95d553462673598549613735f70a5b4d5d0
              command: ["python3", "/opt/backup/backup_runner.py", "restore-verify", "pong"]
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {memory: 256Mi}
              env:
                - {name: BACKUP_AUTOMATION_ENABLED, valueFrom: {secretKeyRef: {name: backup-restore-runtime, key: automation-enabled}}}
                - {name: BACKUP_CONSISTENCY_ACKNOWLEDGED, valueFrom: {secretKeyRef: {name: backup-restore-runtime, key: consistency-acknowledged}}}
                - {name: S3_RESTORE_ENDPOINT, valueFrom: {secretKeyRef: {name: backup-restore-object-store, key: endpoint}}}
                - {name: S3_RESTORE_BUCKET, valueFrom: {secretKeyRef: {name: backup-restore-object-store, key: bucket}}}
                - {name: S3_RESTORE_PREFIX, valueFrom: {secretKeyRef: {name: backup-restore-object-store, key: prefix}}}
                - {name: S3_RESTORE_REGION, valueFrom: {secretKeyRef: {name: backup-restore-object-store, key: region}}}
                - {name: S3_RESTORE_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: backup-restore-object-store, key: access-key-id}}}
                - {name: S3_RESTORE_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: backup-restore-object-store, key: secret-access-key}}}
              volumeMounts: [{name: runner, mountPath: /opt/backup, readOnly: true}]
          volumes: [{name: runner, configMap: {name: backup-runner, defaultMode: 0444}}]
---
