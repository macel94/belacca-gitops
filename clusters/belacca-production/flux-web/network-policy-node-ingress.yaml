apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-web-node-ingress
  namespace: flux-system
  labels:
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: flux-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: flux-web
      app.kubernetes.io/name: flux-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 169.58.143.41/32
        - ipBlock:
            cidr: 169.58.143.42/32
        - ipBlock:
            cidr: 10.42.0.0/24
        - ipBlock:
            cidr: 10.42.1.0/24
        - ipBlock:
            cidr: 169.58.97.73/32
        - ipBlock:
            cidr: 10.42.2.0/24
      ports:
        - protocol: TCP
          port: 9080
