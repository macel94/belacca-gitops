apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
# Preserve the existing unthrottled CPU policy when regenerating vendor
# bootstrap manifests; memory limits and CPU requests remain unchanged.
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    labelSelector: app.kubernetes.io/part-of=flux
  patch: |-
    - op: remove
      path: /spec/template/spec/containers/0/resources/limits/cpu
# Migrate bootstrap-owned fields to Git reconciliation. Without this, SSA
# retains omitted CPU limits because the old bootstrap manager still owns them.
- target:
    group: apps
    version: v1
    kind: Deployment
    name: kustomize-controller
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --override-manager=flux
