# Native production Flux notification contracts.
# Destination Secrets are intentionally out of band; no endpoint or credential
# belongs in Git. See docs/NOTIFICATIONS.md and notification-routing.json.
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: platform-webhook
  namespace: flux-system
  labels:
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: notifications
    belacca.com/notification-class: diagnostic
spec:
  type: alertmanager
  address: http://alertmanager-native.observability.svc.cluster.local:9093/api/v2/alerts/
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: platform-page-webhook
  namespace: flux-system
  labels:
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: notifications
    belacca.com/notification-class: page
    belacca.com/page-policy: operator-signoff-required
spec:
  type: alertmanager
  address: http://alertmanager-native.observability.svc.cluster.local:9093/api/v2/alerts/
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: platform-errors
  namespace: flux-system
  labels:
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: notifications
    belacca.com/notification-class: diagnostic
    belacca.com/page-policy: not-configured
spec:
  providerRef:
    name: platform-webhook
  eventSeverity: error
  eventMetadata:
    cluster: belacca-native
    environment: native-production
    notificationClass: diagnostic
    pagePolicy: not-configured
    routingClass: ticket-dashboard
    runbook: docs/NOTIFICATIONS.md
  eventSources:
    - kind: GitRepository
      name: '*'
      namespace: flux-system
    - kind: Kustomization
      name: '*'
      namespace: flux-system
    - kind: HelmRelease
      name: '*'
      namespace: analytics
    - kind: HelmRelease
      name: '*'
      namespace: cert-manager
    - kind: HelmRelease
      name: '*'
      namespace: dex
    - kind: HelmRelease
      name: '*'
      namespace: flux-system
    - kind: HelmRelease
      name: '*'
      namespace: headlamp
    - kind: HelmRelease
      name: '*'
      namespace: kube-system
    - kind: HelmRelease
      name: '*'
      namespace: longhorn-system
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: platform-deployments
  namespace: flux-system
  labels:
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: notifications
    belacca.com/notification-class: diagnostic
    belacca.com/page-policy: not-configured
spec:
  providerRef:
    name: platform-webhook
  eventSeverity: info
  inclusionList:
    - '.*succeeded.*'
    - '.*ready.*'
  exclusionList:
    - '.*Dependencies do not meet ready condition.*'
  eventMetadata:
    cluster: belacca-native
    environment: native-production
    notificationClass: diagnostic
    pagePolicy: not-configured
    routingClass: ticket-dashboard
    runbook: docs/NOTIFICATIONS.md
  eventSources:
    - kind: GitRepository
      name: '*'
      namespace: flux-system
    - kind: Kustomization
      name: '*'
      namespace: flux-system
    - kind: HelmRelease
      name: '*'
      namespace: analytics
    - kind: HelmRelease
      name: '*'
      namespace: cert-manager
    - kind: HelmRelease
      name: '*'
      namespace: dex
    - kind: HelmRelease
      name: '*'
      namespace: flux-system
    - kind: HelmRelease
      name: '*'
      namespace: headlamp
    - kind: HelmRelease
      name: '*'
      namespace: kube-system
    - kind: HelmRelease
      name: '*'
      namespace: longhorn-system
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: platform-page-errors
  namespace: flux-system
  labels:
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: notifications
    belacca.com/notification-class: page
    belacca.com/page-policy: operator-signoff-required
spec:
  providerRef:
    name: platform-page-webhook
  eventSeverity: error
  eventMetadata:
    cluster: belacca-native
    environment: native-production
    notificationClass: page
    pagePolicy: operator-signoff-required
    routingClass: page
    runbook: docs/NOTIFICATIONS.md
  eventSources:
    # The root and public application Kustomizations are intentionally named;
    # low-level component errors remain in the diagnostic lane.
    - kind: Kustomization
      name: flux-system
      namespace: flux-system
    - kind: Kustomization
      name: pong
      namespace: flux-system
    - kind: Kustomization
      name: portfolio
      namespace: flux-system
    - kind: Kustomization
      name: native-analytics
      namespace: flux-system
    - kind: Kustomization
      name: native-dex
      namespace: flux-system
    - kind: Kustomization
      name: native-headlamp
      namespace: flux-system
    - kind: Kustomization
      name: native-flux-web
      namespace: flux-system
    - kind: HelmRelease
      name: traefik
      namespace: kube-system
    - kind: HelmRelease
      name: longhorn
      namespace: longhorn-system
    - kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: platform-page-recovery
  namespace: flux-system
  labels:
    belacca.com/stage: native-production
    belacca.com/project: platform
    belacca.com/component: notifications
    belacca.com/notification-class: page-recovery
    belacca.com/page-policy: operator-signoff-required
spec:
  providerRef:
    name: platform-page-webhook
  eventSeverity: info
  inclusionList:
    - '.*succeeded.*'
    - '.*ready.*'
  exclusionList:
    - '.*Dependencies do not meet ready condition.*'
  eventMetadata:
    cluster: belacca-native
    environment: native-production
    notificationClass: page-recovery
    pagePolicy: operator-signoff-required
    routingClass: page
    runbook: docs/NOTIFICATIONS.md
  eventSources:
    - kind: Kustomization
      name: flux-system
      namespace: flux-system
    - kind: Kustomization
      name: pong
      namespace: flux-system
    - kind: Kustomization
      name: portfolio
      namespace: flux-system
    - kind: Kustomization
      name: native-analytics
      namespace: flux-system
    - kind: Kustomization
      name: native-dex
      namespace: flux-system
    - kind: Kustomization
      name: native-headlamp
      namespace: flux-system
    - kind: Kustomization
      name: native-flux-web
      namespace: flux-system
    - kind: HelmRelease
      name: traefik
      namespace: kube-system
    - kind: HelmRelease
      name: longhorn
      namespace: longhorn-system
    - kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
