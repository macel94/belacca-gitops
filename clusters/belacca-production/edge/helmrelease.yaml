apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: kube-system
  labels:
    belacca.com/component: ingress
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: traefik
      version: "41.2.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: kube-system
      interval: 1h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: traefik
      digest: sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac
      pullPolicy: IfNotPresent
    versionOverride: v3.7.10
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    deployment:
      kind: DaemonSet
      revisionHistoryLimit: 2
      minReadySeconds: 5
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    # Bind the native edge directly to the host network. The DaemonSet is
    # restricted to .41/.42, while .73 remains the old public k3d edge.
    hostNetwork: true
    service:
      enabled: false
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik
    gateway:
      enabled: false
    gatewayClass:
      enabled: false
    api:
      dashboard: false
    providers:
      kubernetesCRD:
        enabled: true
        ingressClass: traefik
        allowCrossNamespace: false
        allowEmptyServices: true
      kubernetesIngress:
        enabled: true
        ingressClass: traefik
        allowEmptyServices: true
        publishedService:
          enabled: false
    ports:
      traefik:
        port: 8080
        expose:
          default: false
      web:
        port: 80
        containerPort: 80
        hostPort: 80
        exposedPort: 80
        expose:
          default: false
      websecure:
        port: 443
        containerPort: 443
        hostPort: 443
        exposedPort: 443
        expose:
          default: false
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
        add:
          - NET_BIND_SERVICE
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    nodeSelector: {}
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - belacca-k3s-02
                    - belacca-k3s-03
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: traefik-kube-system
            topologyKey: kubernetes.io/hostname
    podDisruptionBudget:
      enabled: false
