apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analytics-public
  namespace: analytics
  labels:
    belacca.com/component: routing
    belacca.com/project: analytics
    belacca.com/stage: native-staging
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.priority: "200"
spec:
  ingressClassName: traefik
  tls:
    - secretName: stats-tls
      hosts: [stats.belacca.com]
  rules:
    - host: stats.belacca.com
      http:
        paths:
          - path: /count
            pathType: Exact
            backend:
              service:
                name: goatcounter-direct
                port:
                  number: 80
          - path: /count.js
            pathType: Exact
            backend:
              service:
                name: goatcounter-direct
                port:
                  number: 80
          - path: /status
            pathType: Exact
            backend:
              service:
                name: goatcounter-direct
                port:
                  number: 80
---
