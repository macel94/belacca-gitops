apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dex-http
  namespace: dex
  labels:
    belacca.com/component: routing
    belacca.com/project: platform
    belacca.com/stage: native-staging
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: dex-dex-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: dex.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dex
                port:
                  number: 5556
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dex-https
  namespace: dex
  labels:
    belacca.com/component: routing
    belacca.com/project: platform
    belacca.com/stage: native-staging
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - secretName: dex-tls
      hosts: [dex.belacca.com]
  rules:
    - host: dex.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dex
                port:
                  number: 5556
---
