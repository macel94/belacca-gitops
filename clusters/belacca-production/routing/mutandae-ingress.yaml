apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mutandae-http
  namespace: mutandae
  labels:
    belacca.com/component: routing
    belacca.com/project: mutandae
    belacca.com/stage: native-production
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: mutandae-mutandae-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: mutandae.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mutandae
                port:
                  name: http
    - host: preview.mutandae.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mutandae-preview
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mutandae-https
  namespace: mutandae
  labels:
    belacca.com/component: routing
    belacca.com/project: mutandae
    belacca.com/stage: native-production
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - secretName: mutandae-tls
      hosts:
        - mutandae.com
        - preview.mutandae.com
  rules:
    - host: mutandae.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mutandae
                port:
                  name: http
    - host: preview.mutandae.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mutandae-preview
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mutandae-redirect-https
  namespace: mutandae
  labels:
    belacca.com/component: routing
    belacca.com/project: mutandae
    belacca.com/stage: native-production
spec:
  redirectScheme:
    scheme: https
    permanent: true
