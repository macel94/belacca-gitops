apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-http
  namespace: portfolio
  labels:
    belacca.com/component: routing
    belacca.com/project: portfolio
    belacca.com/stage: native-production
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: portfolio-portfolio-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: francesco.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: francesco-site
                port:
                  name: http
    - host: belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: francesco-site
                port:
                  name: http
    - host: www.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: francesco-site
                port:
                  name: http
    - host: www.francesco.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: francesco-site
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-https
  namespace: portfolio
  labels:
    belacca.com/component: routing
    belacca.com/project: portfolio
    belacca.com/stage: native-production
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: portfolio-apex-to-portfolio@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: portfolio-tls
      hosts:
        - francesco.belacca.com
        - belacca.com
        - www.belacca.com
        - www.francesco.belacca.com
  rules:
    - host: francesco.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: francesco-site
                port:
                  name: http
    - host: belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: francesco-site
                port:
                  name: http
    - host: www.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: francesco-site
                port:
                  name: http
    - host: www.francesco.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: francesco-site
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: apex-to-portfolio
  namespace: portfolio
  labels:
    belacca.com/component: routing
    belacca.com/project: portfolio
    belacca.com/stage: native-production
spec:
  redirectRegex:
    regex: ^https?://(?:www\.)?(?:belacca\.com|francesco\.belacca\.com)/(.*)
    replacement: https://francesco.belacca.com/${1}
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: portfolio-redirect-https
  namespace: portfolio
  labels:
    belacca.com/component: routing
    belacca.com/project: portfolio
    belacca.com/stage: native-production
spec:
  redirectScheme:
    scheme: https
    permanent: true
