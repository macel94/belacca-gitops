apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-auth-traffic
  namespace: analytics
  labels:
    belacca.com/stage: native-production
    belacca.com/project: analytics
    belacca.com/component: analytics-auth
spec:
  podSelector:
    matchLabels:
      app: oauth2-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        # Traefik uses hostNetwork. Same-node traffic preserves the Traefik
        # identity, while cross-node WireGuard forwarding is evaluated from
        # the sending node's CNI gateway. These are exact node-gateway /32s;
        # never replace them with the broad Pod CIDR.
        - ipBlock:
            cidr: 10.42.0.1/32
        - ipBlock:
            cidr: 10.42.1.1/32
        - ipBlock:
            cidr: 10.42.2.1/32
        - ipBlock:
            cidr: 169.58.97.73/32
        - ipBlock:
            cidr: 169.58.143.41/32
        - ipBlock:
            cidr: 169.58.143.42/32
      ports:
        - protocol: TCP
          port: 4180
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-proxy-upstream
  namespace: analytics
  labels:
    belacca.com/stage: native-production
    belacca.com/project: analytics
    belacca.com/component: analytics-auth
spec:
  podSelector:
    matchLabels:
      app: goatcounter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: oauth2-proxy
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        # Public direct collector and the private auth proxy are explicit.
        # Cross-node host-network forwarding is represented by the exact CNI
        # gateway /32s, not by a broad Pod CIDR.
        - ipBlock:
            cidr: 10.42.0.1/32
        - ipBlock:
            cidr: 10.42.1.1/32
        - ipBlock:
            cidr: 10.42.2.1/32
        - ipBlock:
            cidr: 169.58.97.73/32
        - ipBlock:
            cidr: 169.58.143.41/32
        - ipBlock:
            cidr: 169.58.143.42/32
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: portfolio
          podSelector:
            matchLabels:
              app: francesco-site
      ports:
        - protocol: TCP
          port: 8080
