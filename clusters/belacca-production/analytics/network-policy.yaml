apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-auth-traffic
  namespace: analytics
  labels:
    belacca.com/stage: native-staging
    belacca.com/project: analytics
    belacca.com/component: analytics-auth
spec:
  podSelector:
    matchLabels:
      app: oauth2-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 4180
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-proxy-upstream
  namespace: analytics
  labels:
    belacca.com/stage: native-staging
    belacca.com/project: analytics
    belacca.com/component: analytics-auth
spec:
  podSelector:
    matchLabels:
      app: goatcounter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: oauth2-proxy
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: portfolio
          podSelector:
            matchLabels:
              app: francesco-site
      ports:
        - protocol: TCP
          port: 8080
