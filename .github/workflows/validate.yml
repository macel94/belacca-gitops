name: Validate GitOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    name: Render manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.35.0
      - name: Validate service catalog
        run: python3 scripts/validate-catalog.py
      - name: Validate catalog JSON
        run: python3 -m json.tool catalog/services.json >/tmp/services.pretty.json
      - name: Validate recovery contract and drills
        run: python3 scripts/validate-recovery-contract.py
      - name: Validate notification contracts
        run: python3 scripts/validate-notifications.py
      - name: Validate observability contracts and Prometheus rules
        run: |
          set -eu
          python3 scripts/validate-observability.py
          python3 scripts/extract-prometheus-config.py
          version='3.13.2'
          archive="prometheus-${version}.linux-amd64.tar.gz"
          digest='0e8c4d46101bd025ea8265e377d2caabc57f488fc1be1c367f37db69ea41be6f'
          curl --fail --silent --show-error --location \
            "https://github.com/prometheus/prometheus/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          printf '%s  %s\n' "${digest}" "/tmp/${archive}" | sha256sum --check
          mkdir -p /tmp/prometheus
          tar -xzf "/tmp/${archive}" -C /tmp/prometheus --strip-components=1
          /tmp/prometheus/promtool check rules /tmp/native-prometheus.rules.yml
          /tmp/prometheus/promtool check config /tmp/native-prometheus.yml
          /tmp/prometheus/promtool test rules tests/prometheus/native-observability.yml
          /tmp/prometheus/promtool check rules /tmp/historical-prometheus.rules.yml
          /tmp/prometheus/promtool check config /tmp/historical-prometheus.yml
      - name: Render native observability Kustomization
        run: |
          set -eu
          kubectl kustomize clusters/belacca-production/observability >/tmp/native-observability.yaml
          test -s /tmp/native-observability.yaml
          grep -q 'name: native-observability' clusters/belacca-production/native-platform-applications.yaml
          grep -q 'name: prometheus-native' /tmp/native-observability.yaml
          grep -q 'belacca:slo:sli:30d' /tmp/native-observability.yaml
          grep -q 'slo-evidence-adapter.observability.svc.cluster.local:8080' /tmp/native-observability.yaml
      - name: Render every checked-in Kustomization
        # kubectl kustomize parses every YAML document in each active manifest
        # tree while rendering; this avoids adding a second YAML parser just for CI.
        run: |
          set -eu
          while IFS= read -r file; do
            directory="$(dirname "$file")"
            directory="${directory#./}"
            output="/tmp/kustomize-$(printf '%s' "$directory" | tr '/.' '__').yaml"
            kubectl kustomize "$directory" >"$output"
            test -s "$output"
            echo "rendered $directory -> $output"
          done < <(find . -name kustomization.yaml -not -path './.git/*' -print | sort)
      - name: Check rendered output and secret safety
        run: |
          grep -q 'name: pong' clusters/belacca-production/native-applications.yaml
          grep -q 'name: portfolio' clusters/belacca-production/native-applications.yaml
          grep -q 'name: cloudnativepong' clusters/belacca-production/native-sources.yaml
          grep -q 'name: francesco-belacca-site' clusters/belacca-production/native-sources.yaml
          grep -q 'pong.belacca.com' /tmp/kustomize-clusters_belacca-production_routing.yaml
          grep -q 'francesco.belacca.com' /tmp/kustomize-clusters_belacca-production_routing.yaml
          grep -q 'www.francesco.belacca.com' /tmp/kustomize-clusters_belacca-production_routing.yaml
          grep -q 'platform-webhook' /tmp/kustomize-clusters_belacca-production.yaml
          grep -q 'platform-notification-webhook' /tmp/kustomize-clusters_belacca-production.yaml
          grep -q 'cluster: belacca-native' /tmp/kustomize-clusters_belacca-production.yaml
          grep -q 'environment: native-production' /tmp/kustomize-clusters_belacca-production.yaml
          grep -q 'dns01:' clusters/belacca-production/tls/clusterissuer.yaml
          grep -q 'name: cert-manager-cloudflare' clusters/belacca-production/tls/clusterissuer.yaml
          grep -q 'CLOUDFLARE_DNS_API_TOKEN' clusters/belacca-production/tls/clusterissuer.yaml SUBDOMAIN-RUNBOOK.md
          grep -q 'name: native-observability' clusters/belacca-production/native-platform-applications.yaml
          grep -q 'prom/prometheus:v3.13.2@sha256:' /tmp/kustomize-clusters_belacca-production_observability.yaml
          grep -q 'unsafeUseServiceAccountToken: true' clusters/belacca-production/headlamp/helmrelease.yaml
          grep -q -- '- "-proxy-auth=true"' clusters/belacca-production/headlamp/helmrelease.yaml
          test ! -f clusters/belacca-production/secret.yaml
          test ! -f clusters/belacca-production/secret.yml
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          credential_suffixes = (
              'client-secret',
              'cookie-secret',
              'password',
          )
          entry = re.compile(
              r'^(?P<indent> *)(?P<key>[A-Za-z0-9_.-]+):'
              r'(?:[ \t]*(?P<value>.*))?$'
          )
          encrypted_scalar = re.compile(
              r'ENC\[AES256_GCM,data:[^,\]]+,iv:[^,\]]+,tag:[^,\]]+,type:str\]'
          )
          encrypted_regex = '^(data|stringData)$'
          errors = []

          def is_placeholder(value):
              value = value.strip()
              return (
                  len(value) >= 2 and value[0] == '<' and value[-1] == '>'
              ) or (
                  len(value) >= 2 and value[0] == '`' and value[-1] == '`'
              )

          def is_credential_key(key):
              return key == 'CLOUDFLARE_DNS_API_TOKEN' or key.endswith(
                  credential_suffixes
              )

          def check_document(path, lines, document):
              kind = None
              top_level_section = None
              has_sops = False
              sops_encrypted_regex = None
              data_values = []
              encrypted_values = []
              credentials = []

              for line_number, raw in enumerate(lines, 1):
                  if raw.strip() == '---' and not raw.startswith(' '):
                      continue
                  if not raw.strip() or raw.lstrip().startswith('#'):
                      continue
                  match = entry.fullmatch(raw.rstrip('\n'))
                  if not match:
                      continue
                  indent = len(match.group('indent'))
                  key = match.group('key')
                  value = (match.group('value') or '').strip()

                  if indent == 0:
                      top_level_section = key if key in {
                          'data', 'stringData', 'sops'
                      } else None
                      if key == 'kind':
                          kind = value
                      elif key == 'sops':
                          has_sops = True
                      continue

                  if top_level_section == 'sops' and key == 'encrypted_regex':
                      sops_encrypted_regex = value.strip("'\\\"")

                  if top_level_section in {'data', 'stringData'} and value:
                      data_values.append((line_number, key, value))
                  if 'ENC[' in value:
                      encrypted_values.append(
                          (line_number, key, value, top_level_section)
                      )
                  if is_credential_key(key):
                      credentials.append(
                          (line_number, key, value, top_level_section)
                      )

              if has_sops:
                  if kind != 'Secret':
                      errors.append(
                          f'{path}:{document}: SOPS document is not a Secret'
                      )
                  if sops_encrypted_regex != encrypted_regex:
                      errors.append(
                          f'{path}:{document}: SOPS encrypted_regex must target data/stringData'
                      )
                  if not data_values:
                      errors.append(
                          f'{path}:{document}: SOPS Secret has no encrypted data'
                      )

              for line_number, key, value, section in encrypted_values:
                  if not encrypted_scalar.fullmatch(value):
                      errors.append(
                          f'{path}:{line_number}: malformed ENC value for {key}'
                      )
                  elif not has_sops or kind != 'Secret' or section not in {
                      'data', 'stringData', 'sops'
                  }:
                      errors.append(
                          f'{path}:{line_number}: ENC value is outside a SOPS Secret'
                      )

              if has_sops:
                  for line_number, key, value in data_values:
                      if not encrypted_scalar.fullmatch(value):
                          errors.append(
                              f'{path}:{line_number}: SOPS Secret data value for {key} is not ENC-encrypted'
                          )

              for line_number, key, value, section in credentials:
                  if encrypted_scalar.fullmatch(value):
                      if not has_sops or kind != 'Secret' or section not in {
                          'data', 'stringData'
                      }:
                          errors.append(
                              f'{path}:{line_number}: encrypted credential {key} is not in SOPS Secret data'
                          )
                  elif not is_placeholder(value):
                      errors.append(
                          f'{path}:{line_number}: plaintext credential value for {key}'
                      )

          for root in (Path('clusters'), Path('catalog')):
              for path in sorted(root.rglob('*.yaml')) + sorted(root.rglob('*.yml')):
                  lines = path.read_text().splitlines(keepends=True)
                  document = 1
                  start = 0
                  for index, raw in enumerate(lines + ['---']):
                      if raw.strip() == '---' and not raw.startswith(' '):
                          check_document(path, lines[start:index], document)
                          document += 1
                          start = index + 1
                  for line_number, raw in enumerate(lines, 1):
                      if re.search(r'xox[bap]-', raw):
                          errors.append(
                              f'{path}:{line_number}: token-like credential detected'
                          )

          if errors:
              print('\n'.join(errors), file=sys.stderr)
              print('credential-like value found in YAML', file=sys.stderr)
              raise SystemExit(1)
          print('validated credential safety and SOPS Secret structure')
          PY
      - name: Check catalog and manifest diff
        run: git diff --check
